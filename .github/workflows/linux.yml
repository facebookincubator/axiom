name: Linux Build
on:
  push:
    branches:
      - main
    paths:
      - axiom/**
      - velox
      - CMakeLists.txt
      - .github/workflows/linux.yml
      - Makefile
  pull_request:
    paths:
      - axiom/**
      - velox
      - CMakeLists.txt
      - .github/workflows/linux.yml
      - Makefile
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true
jobs:
  build-axiom:
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
    name: Linux ${{ matrix.build_type }}
    runs-on: 32-core-ubuntu
    container:
      image: ghcr.io/facebookincubator/velox-dev:centos9
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      VELOX_DEPENDENCY_SOURCE: SYSTEM
      ICU_SOURCE: SYSTEM
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Ensure Ccache Dir Exists
        run: mkdir -p "$CCACHE_DIR"

      - name: Restore Ccache
        uses: apache/infrastructure-actions/stash/restore@3354c1565d4b0e335b78a76aedd82153a9e144d4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-${{ matrix.build_type }}-default-gcc
      - name: Ccache Restore Status
        run: echo "Restored ccache $(du -sh $CCACHE_DIR 2>/dev/null | cut -f1 || echo empty)"

      - name: Configure Build
        run: |
          if [ "${{ matrix.build_type }}" = "release" ]; then
            ccache -sz -M 1Gi
          else
            ccache -sz -M 5Gi
          fi

      - name: Build
        env:
          MAKEFLAGS: NUM_THREADS=4 MAX_HIGH_MEM_JOBS=4 MAX_LINK_JOBS=2
          CPU_TARGET: "avx"
          EXTRA_CMAKE_FLAGS: -DAXIOM_ENABLE_COLLAGEN=ON
        run: |
          make ${{ matrix.build_type }}

      - name: CCache Statistics After Build
        if: always()
        run: |
          echo "--- ccache summary ---"
          ccache -s | grep -E "Hits|Misses|size|evicted"
          echo "Cache dir size: $(du -sh $CCACHE_DIR 2>/dev/null | cut -f1)"
          echo ""
          echo "--- ccache full stats ---"
          ccache -vs
          echo ""
          echo "--- evicting stale entries ---"
          ccache --evict-older-than 1d
          echo "Cache dir size after eviction: $(du -sh $CCACHE_DIR 2>/dev/null | cut -f1)"

      - name: Save Ccache
        uses: apache/infrastructure-actions/stash/save@3354c1565d4b0e335b78a76aedd82153a9e144d4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-${{ matrix.build_type }}-default-gcc

      - name: Run Tests
        run: |
          ctest --test-dir _build/${{ matrix.build_type }} -j 8 --output-on-failure --no-tests=error

      # The PySpark tests compare Collagen with a local Spark session. They
      # run with PySpark 3.4, the client Collagen supports, which needs Java
      # and Python 3.10 or 3.11; the image's python3 is 3.9.
      - name: Run PySpark Tests
        if: matrix.build_type == 'release'
        run: |
          dnf install -y -q java-17-openjdk-headless
          uv venv -q --python 3.11 /tmp/pyspark-venv
          source /tmp/pyspark-venv/bin/activate
          uv pip install -q "pyspark[connect]==3.4.*" "pandas<2" "numpy<2" "pyarrow<15" \
            psutil parameterized
          export COLLAGEN_SERVER="$GITHUB_WORKSPACE/_build/release/axiom/pyspark/collagen_server"
          python -m unittest -v \
            axiom.pyspark.tests.test_dataframe_cases \
            axiom.pyspark.tests.test_explain

      # The Makefile always configures AXIOM_BUILD_TESTING=ON, so the run above
      # never exercises what a consumer gets. Configure the other combination
      # into a second tree and stop there, compiling nothing: a suite that
      # escapes its guard lands in that consumer's ctest run. CMake logic does
      # not vary by build type, so once is enough.
      - name: Check the consumer configuration registers no suites
        if: matrix.build_type == 'debug'
        run: |
          cmake -B _build/test_utils -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAXIOM_BUILD_TEST_UTILS=ON \
            -DAXIOM_BUILD_TESTING=OFF \
            -DVELOX_MONO_LIBRARY=ON \
            -DVELOX_BUILD_SHARED=ON
          registered=$(cd _build/test_utils && ctest -N 2>/dev/null | grep "axiom_" || true)
          if [ -n "${registered}" ]; then
            echo "Registered with AXIOM_BUILD_TESTING=OFF:"
            echo "${registered}"
            exit 1
          fi
